[project]
name = "discordmusic"
version = "1.0.0"
description = "Simple Discord Music Bot"
license = { text = "MIT" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.13"
dependencies = [
    "discord.py[voice]>=2.7.1",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.2",
    "async_timeout>=5.0.1",
    "dateparser>=1.4.3",
    "pynacl>=1.5.0,<1.6",
    "pytz>=2026.3",
    "webcolors>=25.10.0",
]

[dependency-groups]
dev = ["ruff>=0.16.6", "mypy>=2.3.1"]

[project.urls]
homepage = "https://github.com/kennethsible/discord-music"

# [tool.uv.sources]
# yt-dlp = { git = "https://github.com/yt-dlp/yt-dlp.git" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"
